name: collect

# 3 時間ごとに函館周辺の釣果情報を集めて docs/ に RSS を書き、変わっていればコミットする。
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python3 collector/collect.py
      - name: Commit
        run: |
          git config user.name "fog-feeds bot"
          git config user.email "fog-feeds@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "collect: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
